on:
  push:
    branches:
      - master

jobs:
  deploy-gh-page:
    name: deploy-gh-page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: mkdir ./demo/clever-date
      - run: npm install
      - run: npm run build
      - run: cp -r ./dist/* ./demo/
      - name: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PUBLISH_DIST_DEPLOY_KEY }}
          publish_branch: gh-pages
          publish_dir: ./demo
